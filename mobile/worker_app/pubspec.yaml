name: worker_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0-333.2.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dio: ^5.9.2
  get_it: ^9.2.1
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.2
  go_router: ^17.2.0
  flutter_svg: ^2.2.4
  flutter_spinkit: ^5.2.2
  lottie: ^3.3.3
  flutter_localization: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.13.0+1


flutter_gen:
  output: lib/core/utils/gen/
  line_length: 1000 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:

  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/placeholders/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/poppins_medium.ttf
        - asset: assets/fonts/poppins/poppins_regular.ttf
        - asset: assets/fonts/poppins/poppins_semibold.ttf
        - asset: assets/fonts/poppins/poppins_thin.ttf

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/cairo_medium.ttf
        - asset: assets/fonts/cairo/cairo_regular.ttf
        - asset: assets/fonts/cairo/cairo_semibold.ttf